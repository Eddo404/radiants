name: Build jars
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: radiant-alert
            dir: radiant-alert
          - name: flabebe-alert
            dir: flabebe-alert/flabebe-alert
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-jar
          path: ${{ matrix.dir }}/build/libs/${{ matrix.name }}-*.jar
